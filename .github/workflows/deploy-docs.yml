name: Deploy Starlight docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # astro@7.1.6 declares engines.node >=22.12.0; the previous pin of 20
      # cannot build it. Read .nvmrc so CI and a developer's `nvm use` cannot
      # drift apart.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Structural rules only. The one-time migration corpus counts sit behind
      # --strict-counts and are deliberately NOT run here: they would fail the
      # first time someone legitimately adds a page or an aside.
      - name: Assert content invariants
        run: python3 migration/assert_content.py

      - name: Codemod unit tests
        run: python3 -m unittest discover -s migration -p 'test_*.py' -v

      - name: Unit tests
        run: npm run test:unit

      # starlight-links-validator runs inside the build, so a broken internal
      # link or anchor fails this step and blocks the deploy.
      - name: Build site
        run: npm run build

      - name: Type check
        run: npm run check

      - name: Route parity against the frozen baseline
        run: python3 migration/check_routes.py

      # Checks on the built pages: one sidebar per track, the nav, the home page.
      - name: Site tests
        run: npm run test:site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
